name: KPI Sunday Sync

on:
  schedule:
    - cron: '0 15 * * 0'   # Sundays 10am EST / 11am EDT
  workflow_dispatch:         # Manual trigger — click "Run workflow" anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync ClickUp → Supabase
        env:
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
        run: |
          node << 'EOF'
          // ── CONFIG ──────────────────────────────────────────
          const CU_KEY = process.env.CLICKUP_API_KEY;
          const SB_URL = 'https://btmxozmpzpxisrczlkop.supabase.co';
          const SB_KEY = 'sb_publishable_bv2-JYq4lde4PzvbIBBcIQ_etwTkf1z';

          // Social account task IDs (Postflow writes followers here)
          const SOCIAL = {
            yt:       '86acaxj6w',   // mariabogat YouTube
            li:       '86afp3zn5',   // LinkedIn personal
            li_page:  '86acaxj6x',   // LinkedIn company
            ig:       '86acaxj6v',   // @bogatarchitecture Instagram
            fb:       '86afp3z0p',   // Facebook
            arena_ig: '86agk5hhg',   // AREna AI Instagram
          };
          const FOLLOWERS_FIELD = '9ac216da-5a88-4abf-96f5-394b960c8159';

          // List IDs
          const LIST_POSTS   = '901320901183';  // Social Media › Posts
          const LIST_CONTENT = '901317184169';  // Bogat › Content Production
          const LIST_LEADS   = '901326738812';  // Bogat › Leads
          const LIST_RIVERA  = '901327226437';  // Bogat › 260514 - Rivera Tower

          // ── HELPERS ─────────────────────────────────────────
          const cuGet = async (path) => {
            const r = await fetch(`https://api.clickup.com/api/v2${path}`, {
              headers: { Authorization: CU_KEY }
            });
            if (!r.ok) throw new Error(`ClickUp ${r.status}: ${path}`);
            return r.json();
          };

          const listAllTasks = async (listId, extraParams = '') => {
            let all = [], page = 0;
            while (true) {
              const data = await cuGet(`/list/${listId}/task?page=${page}&include_closed=true${extraParams}`);
              if (!data.tasks?.length) break;
              all.push(...data.tasks);
              if (data.tasks.length < 100) break;
              page++;
            }
            return all;
          };

          const statusIs = (task, ...statuses) =>
            statuses.includes((task.status?.status ?? '').toLowerCase());

          // ── MAIN ────────────────────────────────────────────
          async function main() {
            console.log('Starting KPI sync…');

            // 1. Social followers from Postflow custom field
            const followers = {};
            for (const [key, taskId] of Object.entries(SOCIAL)) {
              try {
                const task = await cuGet(`/task/${taskId}?custom_fields=true`);
                const field = (task.custom_fields ?? []).find(f => f.id === FOLLOWERS_FIELD);
                followers[key] = parseInt(field?.value ?? '0') || 0;
                console.log(`  ${key}: ${followers[key]}`);
              } catch (e) {
                console.warn(`  ${key}: failed (${e.message})`);
                followers[key] = 0;
              }
            }

            // 2. Posts: scheduled in queue + total published
            const posts = await listAllTasks(LIST_POSTS);
            const posts_sch = posts.filter(t => statusIs(t, 'scheduled')).length;
            const posts_pub = posts.filter(t => statusIs(t, 'published', 'complete', 'closed')).length;
            console.log(`  posts_sch: ${posts_sch}, posts_pub: ${posts_pub}`);

            // 3. Content: blog posts published, press mentions
            const content = await listAllTasks(LIST_CONTENT);
            const blog = content.filter(t =>
              t.tags?.some(tag => tag.name === 'blog') &&
              statusIs(t, 'published', 'complete', 'closed')
            ).length;
            const press = content.filter(t =>
              t.tags?.some(tag => tag.name === 'press') ||
              t.name?.toLowerCase().includes('press') ||
              t.name?.toLowerCase().includes('feature') ||
              t.name?.toLowerCase().includes('mention')
            ).length;
            console.log(`  blog: ${blog}, press: ${press}`);

            // 4. Leads pipeline
            const leadTasks = await listAllTasks(LIST_LEADS);
            const leads = leadTasks.filter(t => !statusIs(t, 'won', 'lost', 'closed')).length;
            const proposals = leadTasks.filter(t =>
              statusIs(t, 'proposal', 'proposal sent', 'submitted', 'negotiating')
            ).length;
            console.log(`  leads: ${leads}, proposals: ${proposals}`);

            // 5. Active projects (Rivera Tower = active if it has open tasks)
            const riveraTasks = await cuGet(`/list/${LIST_RIVERA}/task?page=0`);
            const active_proj = (riveraTasks.tasks?.filter(t => !statusIs(t, 'closed', 'complete')).length ?? 0) > 0 ? 1 : 0;
            console.log(`  active_proj: ${active_proj}`);

            // ── Build vals, merge into Supabase (preserve manual fields) ──
            const newVals = {
              ...followers,
              posts_sch,
              posts_pub,
              blog,
              press,
              leads,
              proposals,
              active_proj,
            };

            console.log('\nFinal vals:', JSON.stringify(newVals));

            // Read current row to preserve manual fields (convs, portfolio, newsletter, revenue, invoices)
            const getRes = await fetch(`${SB_URL}/rest/v1/kpi_data?id=eq.bogat&select=vals`, {
              headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` }
            });
            const rows = await getRes.json();
            const existing = rows[0]?.vals ?? {};
            const merged = { ...existing, ...newVals };

            // Write back
            const patchRes = await fetch(`${SB_URL}/rest/v1/kpi_data?id=eq.bogat`, {
              method: 'PATCH',
              headers: {
                apikey: SB_KEY,
                Authorization: `Bearer ${SB_KEY}`,
                'Content-Type': 'application/json',
                Prefer: 'return=minimal',
              },
              body: JSON.stringify({ vals: merged, synced_at: new Date().toISOString() }),
            });

            if (!patchRes.ok) {
              const err = await patchRes.text();
              throw new Error(`Supabase PATCH failed: ${err}`);
            }

            console.log('\n✓ Supabase updated successfully');
            console.log(`✓ Synced at ${new Date().toISOString()}`);
          }

          main().catch(e => { console.error('✗ Sync failed:', e.message); process.exit(1); });
          EOF
